[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge: Autonomous Multi-Agent AI Engineering System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentForge Contributors" }]
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "chromadb>=0.5.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Needed so the sandbox stage can execute the generated FastAPI project
    # against its generated pytest suite.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7 is not compatible with bcrypt >= 4.1
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
]

[project.scripts]
agentforge = "agentforge.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer uses `typer.Option` as default arguments by convention.
"agentforge/main.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
